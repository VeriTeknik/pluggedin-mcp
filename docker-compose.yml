services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    # The image listens on PORT=8081 (see Dockerfile); publish the same port
    ports:
      - "8081:8081"
    env_file:
      - .env.production.local
    # No entrypoint/command/healthcheck overrides: the image's CMD starts the server
    # (node dist/index.js --transport streamable-http) and its HEALTHCHECK probes /health.
    # The image binds 0.0.0.0, so API auth is required by default once PLUGGEDIN_API_KEY
    # is set; set REQUIRE_API_AUTH=false in the env file only if something else gates access.
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # Add any additional environment variables here. To pass CLI flags, override the full command:
    # command: ["node", "dist/index.js", "--transport", "streamable-http", "--require-api-auth"]
