# Dependency overrides for security patches (Dependabot alerts).
# pnpm 10.4+ reads `overrides` from this file (the `pnpm.overrides` field in
# package.json is no longer read by pnpm 11+). Versions are pinned exactly.
# Selector `pkg@<X` only overrides when the resolved version is vulnerable (< X).
overrides:
  # --- Hono / MCP SDK transport stack ---
  # GHSA-88fw-hqm2-52qc (high) + 6 medium advisories are all fixed by 4.12.27.
  # Round 3: 4.12.27 is itself covered by four later advisories.
  hono@<4.12.34: 4.12.34
  # GHSA-frvp-7c67-39w9: path traversal in serve-static on Windows via encoded
  # backslash. Only patched in 2.0.5, i.e. a major bump — legitimate because
  # @modelcontextprotocol/sdk 1.30.0 widened its range to `^1.19.9 || ^2.0.5`.
  # This override therefore REQUIRES the SDK at >=1.30.0; do not lower it.
  # Round 2: 2.0.5 — the version this override previously targeted — is itself
  # covered by a later advisory (<=2.0.9). SDK 1.30.0's '^1.19.9 || ^2.0.5'
  # range admits 2.0.10, so the coupling below still holds.
  '@hono/node-server@<2.0.10': 2.0.10
  # --- Express / routing stack ---
  express-rate-limit@>=8.2.0 <8.2.2: 8.2.2
  path-to-regexp@>=8.0.0 <8.4.0: 8.4.0
  # Round 3: 6.15.2 is affected; 6.16.0 covers both open advisories.
  qs@<6.16.0: 6.16.0
  follow-redirects@<1.16.0: 1.16.0
  # Round 3, CVE-2026-69192: everything up to and including 10.3.0.
  ip-address@<10.3.1: 10.3.1
  # GHSA-v422-hmwv-36x6, reached via express 5.2.1.
  body-parser@>=2.0.0 <2.3.0: 2.3.0
  # --- Build / test toolchain (vite/vitest transitive) ---
  vite@<7.3.5: 7.3.5
  rollup@>=4.0.0 <4.59.0: 4.59.0
  # GHSA round 2: <=8.5.17 vulnerable.
  # Round 3: <=8.5.22 vulnerable.
  postcss@<8.5.23: 8.5.23
  picomatch@<4.0.4: 4.0.4
  # --- Round 3 additions ---
  # GHSA-4c8g-83qw-93j6 (3.1.3), GHSA-v2hh-gcrm-f6hx (3.1.4), then round 3's
  # CVE-2026-18446 / -75899 / -75931. Reached via ajv <- @modelcontextprotocol/sdk.
  #
  # This replaces a second, older `fast-uri@<3.1.4: 3.1.4` entry that sat lower
  # in this list. Two selectors for one package do not merge — the later one
  # pinned fast-uri AT 3.1.4, which is exactly the version the round-3
  # advisories cover, so the audit kept reporting it while an override appeared
  # to address it. One entry per package.
  fast-uri@<3.1.6: 3.1.6
  # CVE-2026-67213 / -67214 / -73086: integer overflow in nanoid(size) that
  # corrupts the process CSPRNG. Not reachable from a literal size, but the
  # cost of updating is nil.
  nanoid@<3.3.18: 3.3.18
  sanitize-html@<2.17.7: 2.17.7
  # GHSA-g7r4-m6w7-qqqr, reached via vite <- vitest (dev only).
  esbuild@>=0.27.3 <0.28.1: 0.28.1
  # GHSA-w7jw-789q-3m8p (critical) + GHSA-395f-4hp3-45gv (high), reached via
  # concurrently (dev only). 1.9.0 clears both; 1.8.4 clears only the critical.
  shell-quote@<1.9.0: 1.9.0
  # --- Shared utilities ---
  flatted@<3.4.2: 3.4.2
  ajv@>=8.0.0 <8.18.0: 8.18.0
  # GHSA-hmw2-7cc7-3qxx, reached via axios and via supertest (dev).
  form-data@>=4.0.0 <4.0.6: 4.0.6

# Allow build scripts only for trusted, build-essential packages (pnpm 10+
# blocks lifecycle scripts by default). esbuild is required by vite/vitest.
onlyBuiltDependencies:
  - esbuild

allowBuilds:
  esbuild: true

# Supply-chain cooldown (pnpm's default minimumReleaseAge) exclusions.
# Each entry is a version pulled deliberately to patch a security advisory or to
# reach a required protocol revision, and is newer than the cooldown window —
# which would otherwise block frozen installs (e.g. the Docker build).
# Exclusions are scoped to exact versions and become no-ops once those versions
# age past the cooldown; the policy stays active for everything else.
minimumReleaseAgeExclude:
  # @modelcontextprotocol/sdk 1.30.0 is required by the '@hono/node-server@<2.0.5'
  # override above (1.30.0 is the first release whose range admits 2.x).
  - '@modelcontextprotocol/sdk@1.30.0'
